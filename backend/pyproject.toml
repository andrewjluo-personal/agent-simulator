[project]
name = "agent-simulator-api"
version = "0.1.0"
description = "FastAPI backend for agent-simulator"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "psycopg[binary,pool]>=3.2.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "uvicorn[standard]>=0.30.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
